# Phase 3 sweep: 4 model families x GGUF quantization levels.
#
# Families chosen to span the range that fits 12 GB, from "too small to be useful" to "as large as
# a 30 FPS-adjacent budget can plausibly carry". Quant levels chosen so each family has a
# highest-precision reference to score its quantized variants against.
#
# Excluded as too large for 12 GB alongside a fast tier and a display: Pixtral 12B,
# Mistral Small 3.1 24B, Llama 4 Scout, Qwen3-VL-32B.
# Refuse to start if another process already holds more than this much VRAM. Peak VRAM is measured
# board-wide (that is what the 12 GB limit is), so a foreign allocation is indistinguishable from
# ours after the fact, and memory pressure silently inflates TTFT. Caught 2026-08-08 when an
# unrelated process held ~9.5 GB and the entire sweep completed with wrong-but-plausible numbers.
max_foreign_vram_gb: 1.5

clip: data/clips/desk_60s.mp4
n_frames: 20        # PROMPT.md asks for answer quality on 20 frames
frame_stride: 90    # ~3 s apart at 30 FPS, so the set spans the whole clip
warmup: 2
max_tokens: 48
prompt: "Describe what you see in one short sentence."

configs:
  - label: SmolVLM2-500M f16
    family: SmolVLM2-500M
    quant: f16
    params: 0.5B
    model: models/SmolVLM2-500M/SmolVLM2-500M-Video-Instruct-f16.gguf
    mmproj: models/SmolVLM2-500M/mmproj-SmolVLM2-500M-Video-Instruct-f16.gguf
  - label: SmolVLM2-500M Q8_0
    family: SmolVLM2-500M
    quant: Q8_0
    params: 0.5B
    model: models/SmolVLM2-500M/SmolVLM2-500M-Video-Instruct-Q8_0.gguf
    mmproj: models/SmolVLM2-500M/mmproj-SmolVLM2-500M-Video-Instruct-Q8_0.gguf

  - label: SmolVLM2-2.2B Q8_0
    family: SmolVLM2-2.2B
    quant: Q8_0
    params: 2.2B
    model: models/SmolVLM2-2.2B/SmolVLM2-2.2B-Instruct-Q8_0.gguf
    mmproj: models/SmolVLM2-2.2B/mmproj-SmolVLM2-2.2B-Instruct-Q8_0.gguf
  - label: SmolVLM2-2.2B Q4_K_M
    family: SmolVLM2-2.2B
    quant: Q4_K_M
    params: 2.2B
    model: models/SmolVLM2-2.2B/SmolVLM2-2.2B-Instruct-Q4_K_M.gguf
    mmproj: models/SmolVLM2-2.2B/mmproj-SmolVLM2-2.2B-Instruct-Q8_0.gguf

  - label: Qwen3-VL-2B Q8_0
    family: Qwen3-VL-2B
    quant: Q8_0
    params: 2B
    model: models/Qwen3-VL-2B/Qwen3VL-2B-Instruct-Q8_0.gguf
    mmproj: models/Qwen3-VL-2B/mmproj-Qwen3VL-2B-Instruct-Q8_0.gguf
  - label: Qwen3-VL-2B Q4_K_M
    family: Qwen3-VL-2B
    quant: Q4_K_M
    params: 2B
    model: models/Qwen3-VL-2B/Qwen3VL-2B-Instruct-Q4_K_M.gguf
    mmproj: models/Qwen3-VL-2B/mmproj-Qwen3VL-2B-Instruct-Q8_0.gguf

  - label: Qwen3-VL-4B Q8_0
    family: Qwen3-VL-4B
    quant: Q8_0
    params: 4B
    model: models/Qwen3-VL-4B/Qwen3VL-4B-Instruct-Q8_0.gguf
    mmproj: models/Qwen3-VL-4B/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf
  - label: Qwen3-VL-4B Q4_K_M
    family: Qwen3-VL-4B
    quant: Q4_K_M
    params: 4B
    model: models/Qwen3-VL-4B/Qwen3VL-4B-Instruct-Q4_K_M.gguf
    mmproj: models/Qwen3-VL-4B/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf

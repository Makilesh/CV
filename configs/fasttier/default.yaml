# Fast tier — runs on EVERY frame inside a ~10 ms budget.
#
# The budget comes from Phase 1's measured per-stage numbers: vlm_total p50 97.66 ms,
# capture_read 32.09 ms (camera-paced), everything else ~0. There is room here, but not unlimited
# room: whatever this costs is paid 30 times a second, forever, whether or not the VLM fires.
#
# encoder: downsample | torch | onnx
encoder: torch
model: mobilenetv3_small_100
input_size: 224
dtype: fp16
device: cuda
clip_norm: false
downsample_size: 32
onnx_path: null
providers: null

# Motion scoring on a 64x64 grayscale thumbnail. Full-resolution differencing costs ~1 ms of pure
# memory traffic to learn what the thumbnail already says.
motion_size: 64

# Rolling reference half-life, in SECONDS not frames, so behaviour does not silently change with
# capture rate. 2 s means a slow drift accumulates instead of being invisible frame by frame,
# while a single noisy frame does not by itself read as novel.
half_life_s: 2.0

keep_embedding: false

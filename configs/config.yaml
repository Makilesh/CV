# Peripheral — root config. Every tunable lives in this tree; nothing is hardcoded in source.
defaults:
  - capture: webcam
  - telemetry: default
  - scheduler: none
  - pipeline: default
  - vlm: qwen3vl_4b_q8
  - fasttier: default
  - encoder_bench: default
  - vlm_bench: default
  - kv_reuse: default
  - hf_reference: default
  - phase4: default
  - phase5: default
  - _self_

seed: 1337

run:
  # These three are overridden by the mandated CLI flags (--duration/--headless/--metrics-out).
  # They are here so a run is fully reproducible from a config file alone.
  duration_s: 5.0
  headless: true
  metrics_out: results/metrics.json

record:
  path: data/clips/clip.mp4
  fourcc: mp4v   # widely readable without extra codecs on Windows

paths:
  results_dir: results
  data_dir: data      # clips — gitignored
  models_dir: models  # weights — gitignored

hydra:
  output_subdir: null   # no per-run .hydra dirs; metrics JSON is our run record
  run:
    dir: .

# CHOSEN Phase 3 configuration: Qwen3-VL-4B-Instruct, Q8_0.
#
# Defended against the 12 GB constraint and the 400 ms TTFT target, from the sweep in
# results/phase3_vlm_bench.json (8 configurations, 4 families x 2 quant levels):
#
#   config                 peak VRAM   TTFT p95   tok/s   noise floor   quant damage
#   SmolVLM2-500M   Q8_0      1.32 GB      61 ms     255         0.921          0.094
#   SmolVLM2-2.2B   Q4_K_M    3.06 GB      88 ms     144         0.944          0.208
#   Qwen3-VL-2B     Q8_0      3.60 GB     125 ms     120         0.955              —
#   Qwen3-VL-4B     Q4_K_M    4.38 GB     166 ms      80         0.992          0.143
#   Qwen3-VL-4B     Q8_0      6.04 GB     163 ms      64         0.991              —   <- chosen
#
# WHY NOT THE FASTEST. All 8 configurations clear the 400 ms p95 TTFT target with room to spare,
# so latency does not decide this — quality does. SmolVLM2-500M hallucinates the setting (it
# described this indoor room as "a gymnasium"); SmolVLM2-2.2B is accurate but vague. Both Qwen3-VL
# models produce specific, correct descriptions.
#
# WHY Q8_0 AND NOT Q4_K_M. Q4_K_M costs 0.143 content-F1 against the Q8_0 reference, which is real
# damage — it sits well below the 0.992 noise floor, so it is not serving noise. Q8_0 costs
# 1.66 GB more VRAM and 16 tok/s of decode, and we have both to spend.
#
# VRAM BUDGET. 6.04 GB VLM + 0.61 GB fast tier (Phase 2 measured) = 6.65 GB of 11.94 GB, leaving
# ~5.3 GB for the Phase 5 cache, the Phase 7 GUI and the display. If that headroom is ever needed,
# Qwen3-VL-4B Q4_K_M is the drop-in fallback at 4.38 GB for 0.143 F1.
#
# READ THE NOISE FLOOR COLUMN. llama-server is not deterministic at temperature 0: the same frame
# asked twice back to back, with identical cache state and the prompt cache disabled, returns a
# different string 67% of the time on Qwen3-VL-2B Q4_K_M. The differences are paraphrase, which is
# what floating-point noise flipping a near-tie in greedy argmax looks like. A fidelity score is
# meaningless without knowing how much a model disagrees with itself.
name: Qwen3-VL-4B-Instruct-Q8_0
bench_label: Qwen3-VL-4B Q8_0   # the sweep row this choice is defended by; a test checks it exists
binary: vendor/llama.cpp/llama-server.exe
model: models/Qwen3-VL-4B/Qwen3VL-4B-Instruct-Q8_0.gguf
mmproj: models/Qwen3-VL-4B/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf

host: 127.0.0.1
port: 8080
n_gpu_layers: 99
ctx_size: 4096
jpeg_quality: 85

autostart: true
startup_timeout_s: 300.0

# Text before image, so the standing instruction is a cacheable prefix. Image tokens differ every
# frame, so anything placed after the image can never be reused. See results/phase3_kv_reuse.json.
extra_args: ["--cache-reuse", "256"]
